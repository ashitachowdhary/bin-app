<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>EcoRoute — Kabadiwala Request</title>
<style>
  body{font-family:'DM Sans',sans-serif;background:#f4f7f4;padding:20px;max-width:430px;margin:0 auto;}
  .card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 2px 12px rgba(0,0,0,.08);margin-bottom:14px;}
  .bin-tag{font-weight:700;color:#1a7a3e;font-size:18px;}
  .status{font-size:13px;color:#6b7f6b;margin-top:6px;}
  .verify-box{padding:14px;border-radius:12px;margin:12px 0;font-size:13px;}
  .verify-ok{background:#e8f5ee;color:#1a7a3e;border:1px solid #c2e0cd;}
  .verify-fail{background:#fef2f2;color:#dc2626;border:1px solid #fecaca;}
  .verify-loading{background:#f0f5f0;color:#6b7f6b;}
  input,textarea{width:100%;padding:11px;border-radius:10px;border:1.5px solid #e6ede9;margin-bottom:10px;font-family:inherit;}
  button{width:100%;padding:14px;border-radius:14px;border:none;background:#1a7a3e;color:#fff;font-weight:700;font-size:15px;cursor:pointer;}
  button:disabled{background:#9cad9c;cursor:not-allowed;}
</style>
</head>
<body>

<div class="card">
  <div class="bin-tag" id="binLabel">Loading bin info…</div>
  <div class="status" id="binArea"></div>
</div>

<div class="verify-box verify-loading" id="verifyBox">
  📍 Checking your location…
</div>

<div class="card" id="formCard" style="display:none">
  <label style="font-size:12px;color:#6b7f6b;">What are you giving? (scrap/bhangar)</label>
  <select id="itemType" style="width:100%;padding:11px;border-radius:10px;margin:8px 0 12px;">
    <option value="Recyclable">Recyclable (plastic/paper/metal)</option>
    <option value="E-Waste">E-Waste (phones/wires/appliances)</option>
    <option value="General">General Scrap</option>
  </select>
  <textarea id="desc" placeholder="Describe items (e.g. old newspapers, 2 plastic chairs)"></textarea>
  <input type="tel" id="phone" placeholder="10-digit phone number"/>
  <button id="submitBtn" onclick="submitKabadiRequest()">Request Kabadiwala</button>
</div>

<div class="card" id="successCard" style="display:none;text-align:center">
  <div style="font-size:40px;">✅</div>
  <div style="font-weight:700;color:#1a7a3e;margin:8px 0;">Request Sent!</div>
  <div style="font-size:13px;color:#6b7f6b;" id="trackId"></div>
</div>

<script>
const FIREBASE_DB_URL = 'https://ecoroute-a871a-default-rtdb.firebaseio.com';

// Same BINS data as index.html — keep in sync
const BINS = [
  {id:'BIN-001',name:'Pathankot Bus Stand',area:'Bus Stand',lat:32.2748,lng:75.6520},
  {id:'BIN-002',name:'Railway Station',area:'Railway Station',lat:32.2684,lng:75.6443},
  {id:'BIN-003',name:'Dalhousie Road Market',area:'Dalhousie Road',lat:32.2810,lng:75.6478},
  {id:'BIN-004',name:'Chakki Bank',area:'Chakki Bank',lat:32.2612,lng:75.6571},
  {id:'BIN-005',name:'Mamun Road',area:'Mamun',lat:32.2890,lng:75.6340},
  {id:'BIN-006',name:'Civil Lines Market',area:'Civil Lines',lat:32.2762,lng:75.6598},
  {id:'BIN-007',name:'Shahpur Kandi Road',area:'Shahpur Kandi',lat:32.2530,lng:75.6420},
  {id:'BIN-008',name:'Mirthal Chowk',area:'Mirthal',lat:32.3050,lng:75.6250},
  {id:'BIN-009',name:'Sujanpur Road',area:'Sujanpur',lat:32.2680,lng:75.6670},
  {id:'BIN-010',name:'Dunera Chowk',area:'Dunera',lat:32.2920,lng:75.6600},
  {id:'BIN-011',name:'Pathankot Fort',area:'Fort',lat:32.2720,lng:75.6380},
  {id:'BIN-012',name:'Nurpur Road Junction',area:'Nurpur Road',lat:32.2600,lng:75.6490},
];

const params = new URLSearchParams(window.location.search);
const binId = params.get('bin');
const bin = BINS.find(b => b.id === binId);

let userLat = null, userLng = null, distanceMeters = null, isVerified = false;
const MAX_DISTANCE_METERS = 150; // adjust as needed — GPS accuracy margin

if (!bin) {
  document.getElementById('binLabel').textContent = 'Invalid or missing bin ID';
  document.getElementById('verifyBox').className = 'verify-box verify-fail';
  document.getElementById('verifyBox').textContent = '❌ This QR code is not recognized.';
} else {
  document.getElementById('binLabel').textContent = '📍 ' + bin.name;
  document.getElementById('binArea').textContent = bin.area + ' · ' + bin.id;
  verifyLocation();
}

function haversineDistance(lat1, lng1, lat2, lng2) {
  const R = 6371000; // meters
  const toRad = d => d * Math.PI / 180;
  const dLat = toRad(lat2 - lat1);
  const dLng = toRad(lng2 - lng1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function verifyLocation() {
  if (!navigator.geolocation) {
    showVerifyFail('Geolocation not supported on this device.');
    return;
  }
  navigator.geolocation.getCurrentPosition(
    pos => {
      userLat = pos.coords.latitude;
      userLng = pos.coords.longitude;
      distanceMeters = Math.round(haversineDistance(userLat, userLng, bin.lat, bin.lng));

      if (distanceMeters <= MAX_DISTANCE_METERS) {
        isVerified = true;
        document.getElementById('verifyBox').className = 'verify-box verify-ok';
        document.getElementById('verifyBox').textContent = '✅ Location verified — you are near ' + bin.name + ' (' + distanceMeters + 'm)';
        document.getElementById('formCard').style.display = 'block';
      } else {
        isVerified = false;
        document.getElementById('verifyBox').className = 'verify-box verify-fail';
        document.getElementById('verifyBox').textContent = '⚠️ You appear ' + distanceMeters + 'm away from this bin. Please scan the QR while standing near it.';
      }
    },
    err => {
      showVerifyFail('Location access denied. Please allow location to continue.');
    },
    { enableHighAccuracy: true, timeout: 10000 }
  );
}

function showVerifyFail(msg) {
  document.getElementById('verifyBox').className = 'verify-box verify-fail';
  document.getElementById('verifyBox').textContent = '❌ ' + msg;
}

async function submitKabadiRequest() {
  const itemType = document.getElementById('itemType').value;
  const desc = document.getElementById('desc').value.trim();
  const phone = document.getElementById('phone').value.trim();

  if (!/^\d{10}$/.test(phone)) { alert('Enter valid 10-digit phone number'); return; }
  if (!isVerified) { alert('Location not verified. Please scan the QR near the bin.'); return; }

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = 'Submitting...';

  const id = 'KB-' + Date.now();
  const payload = {
    binId: bin.id,
    binName: bin.name,
    itemType,
    description: desc,
    phone,
    status: 'pending',
    assignedKabadiwala: null,
    geo: { lat: userLat, lng: userLng, distanceFromBin: distanceMeters, verified: true },
    requestedAt: new Date().toISOString()
  };

  try {
    const res = await fetch(`${FIREBASE_DB_URL}/kabadi_requests/${id}.json`, {
      method: 'PUT',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(payload)
    });
    if (!res.ok) throw new Error('write failed');

    document.getElementById('formCard').style.display = 'none';
    document.getElementById('successCard').style.display = 'block';
    document.getElementById('trackId').textContent = 'Tracking ID: ' + id;
  } catch (e) {
    alert('Could not submit. Check connection and try again.');
    btn.disabled = false;
    btn.textContent = 'Request Kabadiwala';
  }
}
</script>
</body>
</html>
